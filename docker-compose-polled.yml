version: '3.8'

services:
  app:
    # Build locally from the hardened Dockerfile (`docker compose build`), or point at a published image.
    image: firefly-plaid-connector-2:1.6.0
    build: .
    # Runs as non-root uid 65532 (distroless nonroot). Hardening:
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    hostname: plaidconnector
    restart: always
    volumes:
        - type: bind
          source: "${HOST_APPLICATION_CONFIG_FILE_LOCATION}"
          target: /opt/fpc-config/application.yml
          read_only: true
        - type: bind
          source: "${HOST_PERSISTENCE_DIRECTORY_LOCATION}"
          target: /opt/fpc-cursors
    environment:
      - SPRING_CONFIG_LOCATION=/opt/fpc-config/application.yml
      - FIREFLYPLAIDCONNECTOR2_POLLED_CURSORFILEDIRECTORYPATH=/opt/fpc-cursors

volumes:
  fpc-cursors:
