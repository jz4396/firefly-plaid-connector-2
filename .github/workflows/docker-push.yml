# Release image build: hardened Dockerfile, actions pinned by commit SHA,
# image pushed to GHCR and given a signed SLSA build-provenance attestation.
# Verify before deploying:
#   gh attestation verify oci://ghcr.io/jz4396/firefly-plaid-connector-2@sha256:<digest> --repo jz4396/firefly-plaid-connector-2
name: Create and push Docker image to GHCR

on:
  release:
    types: ['published']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.6.0)'
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    if: github.repository == 'jz4396/firefly-plaid-connector-2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hardened, digest-pinned Dockerfile (non-root distroless runtime); tests run inside the build
      - name: Build image
        run: docker build --build-arg RUN_TESTS=true -t "$REGISTRY/$IMAGE_NAME:latest" .

      - name: Push
        id: push
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          docker image tag "$REGISTRY/$IMAGE_NAME:latest" "$REGISTRY/$IMAGE_NAME:$REF_NAME"
          docker image push --all-tags "$REGISTRY/$IMAGE_NAME"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE_NAME:$REF_NAME" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REGISTRY/$IMAGE_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
